# lumon-login-theme — config (shell syntax: KEY=VALUE)

# mpv volume. 100 = unity. The Severance main titles are dynamic; 60–70 sits
# under the desktop without being background-quiet.
VOLUME=65

# 0 = play through once per unlock. 1 = loop until you stop it.
LOOP=0

# The theme plays every time you UNLOCK the screen. Set this to 1 and the
# session also locks itself at boot, so a cold login gets the theme too.
LOCK_ON_LOGIN=1

# Seconds to wait for omarchy-shell to be ready before the boot lock. Lower it
# if your machine boots fast and you see the desktop flash before the lock.
LOGIN_DELAY=1.5

# Ignore an unlock that happens within this many seconds of the last play —
# stops a quick lock/unlock fumble from restarting the track.
RETRIGGER_DEBOUNCE=8

# Shown in the bar's media widget.
TITLE="Severance — Main Titles"

# Optional explicit path. If unset, the first match of
# ~/.config/omarchy/lumon/main-titles.{mp3,opus,m4a,ogg,flac,wav} is used.
# AUDIO=/home/you/Music/severance-main-titles.mp3
