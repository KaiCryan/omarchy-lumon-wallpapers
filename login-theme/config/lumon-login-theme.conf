# lumon-login-theme — config (shell syntax: KEY=VALUE)

# mpv volume. 100 = unity. The Severance main titles are dynamic; 60–70 sits
# under the desktop without being background-quiet.
VOLUME=65

# 0 = play once per login (a ceremony). 1 = loop until you stop it.
LOOP=0

# 1 = drop the Lumon lock screen the moment the session starts, so the theme
# scores the "login screen" and keeps playing after you unlock.
LOCK_ON_LOGIN=1

# Seconds to wait for omarchy-shell to be ready before locking. Lower it if
# your machine boots fast and you see the desktop flash before the lock.
LOGIN_DELAY=1.5

# Shown in the bar's media widget.
TITLE="Severance — Main Titles"

# Optional explicit path. If unset, the first match of
# ~/.config/omarchy/lumon/main-titles.{mp3,opus,m4a,ogg,flac,wav} is used.
# AUDIO=/home/you/Music/severance-main-titles.mp3
